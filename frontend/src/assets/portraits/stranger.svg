<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="800" height="1000">
  <!-- DEV PLACEHOLDER: procedural, not production-cleared art. -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="28%" r="85%">
      <stop offset="0" stop-color="#3b362e"/><stop offset=".5" stop-color="#211e19"/><stop offset="1" stop-color="#0f0e0c"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2=".25">
      <stop offset="0" stop-color="#c9b39a"/><stop offset=".38" stop-color="#9c8670"/><stop offset=".72" stop-color="#4f4338"/><stop offset="1" stop-color="#1d1915"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d6b5a"/><stop offset=".6" stop-color="#3a3129"/><stop offset="1" stop-color="#16130f"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3830"/><stop offset=".55" stop-color="#1f1c18"/><stop offset="1" stop-color="#0d0c0a"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#b48a4e" stop-opacity=".55"/><stop offset=".25" stop-color="#b48a4e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cheek" cx="35%" cy="55%" r="40%">
      <stop offset="0" stop-color="#e3cbb0" stop-opacity=".35"/><stop offset="1" stop-color="#e3cbb0" stop-opacity="0"/>
    </radialGradient>
    <filter id="s1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="s4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="s9" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .44  0 0 0 .9 -.35"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- back hair mass -->
  <path filter="url(#s4)" fill="#0d0b09" d="M112 190C100 96 160 46 208 46C266 48 312 98 306 186C302 262 322 346 336 430L318 500H86L70 430C96 344 116 270 112 190Z"/>
  <!-- shoulders -->
  <path filter="url(#s1)" fill="url(#cloth)" d="M28 500C40 436 104 398 160 386L244 386C300 396 360 436 372 500Z"/>
  <!-- neck -->
  <path filter="url(#s1)" fill="url(#neck)" d="M176 300L174 392C192 410 220 410 236 392L232 300Z"/>
  <path filter="url(#s4)" fill="#120f0c" opacity=".7" d="M176 330C196 352 222 352 234 334L234 360C214 372 192 370 176 356Z"/>
  <!-- face -->
  <path filter="url(#s1)" fill="url(#skin)" d="M150 196C148 132 182 104 206 104C240 104 264 134 262 198C260 254 246 302 218 328C208 337 196 337 186 328C160 304 152 254 150 196Z"/>
  <ellipse cx="182" cy="248" rx="34" ry="42" fill="url(#cheek)"/>
  <!-- eye sockets, eyes, brows -->
  <g filter="url(#s4)" fill="#2a221b" opacity=".75">
    <ellipse cx="183" cy="206" rx="19" ry="11"/><ellipse cx="234" cy="206" rx="17" ry="11"/>
  </g>
  <g filter="url(#s1)">
    <path fill="#15110e" d="M170 207C176 200 190 200 196 207C190 211 176 211 170 207Z"/>
    <path fill="#15110e" d="M223 207C229 201 241 201 246 207C240 211 229 211 223 207Z"/>
    <circle cx="181" cy="205.5" r="1.4" fill="#d9c6ae" opacity=".8"/>
    <path fill="none" stroke="#2b221b" stroke-width="3.5" stroke-linecap="round" opacity=".8" d="M167 192C176 186 190 186 198 190"/>
    <path fill="none" stroke="#1a1511" stroke-width="3.5" stroke-linecap="round" opacity=".8" d="M222 190C230 186 242 186 249 191"/>
  </g>
  <!-- nose -->
  <path filter="url(#s4)" fill="#3a2f26" opacity=".6" d="M214 212C218 232 222 250 224 262C218 268 208 268 202 264C210 256 212 236 214 212Z"/>
  <path filter="url(#s1)" fill="#e6d2b9" opacity=".25" d="M204 216C202 236 200 250 198 260C202 262 204 262 206 260C206 246 206 232 204 216Z"/>
  <!-- lips (closed); the animated mouth layer sits over this point -->
  <g filter="url(#s1)">
    <path fill="#6a4538" d="M188 289C196 284 202 285 206 287C210 285 218 284 226 289C218 292 196 292 188 289Z"/>
    <path fill="#7c5345" d="M190 290C198 300 216 300 224 290C214 293 200 293 190 290Z"/>
    <path fill="none" stroke="#2a1a14" stroke-width="1.6" stroke-linecap="round" d="M189 290C200 292 214 292 225 290"/>
  </g>
  <!-- front hair curtains -->
  <path filter="url(#s1)" fill="#120f0c" d="M206 98C160 98 132 132 132 196C132 252 124 310 106 370L140 380C150 320 154 262 160 214C168 160 190 128 222 116C250 120 270 150 272 200C276 258 280 320 294 380L326 372C306 300 300 240 300 186C298 126 262 96 206 98Z"/>
  <path fill="url(#rim)" filter="url(#s4)" d="M262 130C290 160 296 220 300 280C304 330 312 360 324 380L300 386C288 330 280 260 274 200Z"/>
  <path fill="none" stroke="#5a4a38" stroke-width="1.2" opacity=".35" filter="url(#s1)" d="M170 120C150 160 146 240 132 330M190 112C170 150 166 210 160 280M248 118C268 150 276 220 282 300"/>
  <!-- vignette + grain -->
  <rect width="400" height="500" fill="#000" opacity=".18" filter="url(#s9)" mask="none"/>
  <rect width="400" height="500" filter="url(#grain)" opacity=".55"/>
</svg>
